<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; margin: 20px; }
      h1 { font-size: 1.2em; }
      button { background-color: #4285F4; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; margin-top: 15px; }
      button:disabled { background-color: #aaa; }
      #status { margin-top: 10px; font-size: 0.9em; color: #555; }
    </style>
  </head>
  <body>
    <h1>Cargar Archivos XML Locales</h1>
    <form id="upload-form">
      <input type="file" id="file-input" name="files" multiple accept=".xml,text/xml">
      <br>
      <button type="submit">Procesar Archivos</button>
    </form>
    <div id="status"></div>

    <script>
      document.getElementById('upload-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const files = document.getElementById('file-input').files;
        if (files.length === 0) {
          document.getElementById('status').innerText = 'Por favor, selecciona al menos un archivo.';
          return;
        }

        const submitButton = this.querySelector('button');
        submitButton.disabled = true;
        document.getElementById('status').innerText = 'Leyendo archivos...';

        const filePromises = Array.from(files).map(file => {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (event) => resolve(event.target.result);
            reader.onerror = (error) => reject(error);
            reader.readAsText(file);
          });
        });

        Promise.all(filePromises)
          .then(fileContents => {
            document.getElementById('status').innerText = 'Enviando archivos al servidor...';
            google.script.run
              .withSuccessHandler(function(response) {
                document.getElementById('status').innerText = response.message;
                if (response.status === 'success') {
                  setTimeout(function() { google.script.host.close(); }, 2000);
                } else {
                  submitButton.disabled = false;
                }
              })
              .withFailureHandler(function(error) {
                document.getElementById('status').innerText = 'Error: ' + error.message;
                submitButton.disabled = false;
              })
              .processLocalFiles({files: fileContents});
          })
          .catch(error => {
            document.getElementById('status').innerText = 'Error al leer los archivos: ' + error.message;
            submitButton.disabled = false;
          });
      });
    </script>
  </body>
</html>
