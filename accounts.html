<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; margin: 20px; }
      table { width: 100%; border-collapse: collapse; margin-top: 15px; }
      th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
      th { background-color: #f2f2f2; }
      form { margin-top: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
      input { width: 200px; padding: 6px; margin-right: 10px; }
      button { background-color: #4285F4; color: white; padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; }
      #status { margin-top: 10px; }
    </style>
  </head>
  <body>
    <h2>Administrar Catálogo de Cuentas</h2>

    <form id="add-account-form">
      <h3>Agregar Nueva Cuenta</h3>
      <input type="text" id="codigo" placeholder="Código (ej: 1101.01)" required>
      <input type="text" id="nombre" placeholder="Nombre de la Cuenta" required>
      <button type="submit">Agregar</button>
    </form>
    <div id="status"></div>

    <h3>Cuentas Actuales</h3>
    <table id="accounts-table">
      <thead>
        <tr>
          <th>Código</th>
          <th>Nombre de Cuenta</th>
        </tr>
      </thead>
      <tbody>
        <!-- Data will be loaded here by script -->
      </tbody>
    </table>

    <script>
      // Load existing accounts when the dialog opens
      window.onload = function() {
        google.script.run.withSuccessHandler(populateTable).getChartOfAccounts();
      };

      function populateTable(accounts) {
        const tableBody = document.getElementById('accounts-table').getElementsByTagName('tbody')[0];
        tableBody.innerHTML = ''; // Clear existing data
        if (accounts && accounts.length > 0) {
          accounts.forEach(function(account) {
            const row = tableBody.insertRow();
            row.insertCell(0).innerText = account.codigo;
            row.insertCell(1).innerText = account.nombre;
          });
        }
      }

      // Handle form submission
      document.getElementById('add-account-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const newAccount = {
          codigo: document.getElementById('codigo').value,
          nombre: document.getElementById('nombre').value
        };

        document.getElementById('status').innerText = 'Agregando...';

        google.script.run
          .withSuccessHandler(function(response) {
            document.getElementById('status').innerText = response.message;
            if(response.status === 'success') {
              // Refresh the table
              google.script.run.withSuccessHandler(populateTable).getChartOfAccounts();
              // Clear the form
              document.getElementById('add-account-form').reset();
            }
          })
          .addChartOfAccount(newAccount);
      });
    </script>
  </body>
</html>
